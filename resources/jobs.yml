# Illustrative Asset Bundle resource, not an export of the original job.
# Configure compute and validate in your workspace. The unmodified Bronze
# notebook depends on existing Silver tables: see README for bootstrapping.
resources:
  jobs:
    retail_lakehouse:
      name: retail-lakehouse-example
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/01_bronze_ingestion.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/02_silver_transformations.py
        - task_key: data_quality
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/04_data_quality.py
        - task_key: gold
          depends_on:
            - task_key: data_quality
          notebook_task:
            notebook_path: ../notebooks/03_gold_analytics.py
